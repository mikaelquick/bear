<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Björn</title>

<!-- The way in for someone who only ever wants the browser. The address
     exists to be bookmarked and shared; the game itself lives at the root,
     so this page only sends you back there with ?web, which is what makes
     the game skip the question about adding it to the home screen.

     No second copy of the game, then — one page pointing home. -->
<link rel="canonical" href="../">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../?web">
<script>location.replace('../?web');</script>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: #11151f;
    color: #8f9bb3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>
<!-- Only ever seen if the redirect does not go through. -->
<p><a href="../?web" style="color: #f0a830">Starta Björn</a></p>
</body>
</html>
